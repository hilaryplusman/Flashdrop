name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的运行环境已预装 Android SDK，只需接受许可协议
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 仓库里直接放工程文件，或只放 FlashDrop-android.zip，两种方式都支持
      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "DIR=." >> "$GITHUB_ENV"
          else
            unzip -q FlashDrop-android.zip -d _src
            echo "DIR=_src/FlashDrop" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # 精简版：即使失败也不影响调试版的发布
      - name: Build release APK (minified)
        continue-on-error: true
        working-directory: ${{ env.DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ${{ env.DIR }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "FlashDrop-v${VER}-b${{ github.run_number }}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "FlashDrop-v${VER}-b${{ github.run_number }}-release.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FlashDrop-debug-apk
          path: ${{ env.DIR }}/FlashDrop-*.apk

      # 发布到 Releases，手机上的 GitHub App 里可以直接下载
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlashDrop build ${{ github.run_number }}
          files: ${{ env.DIR }}/FlashDrop-*.apk
