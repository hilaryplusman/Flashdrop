name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "DIR=." >> "$GITHUB_ENV"
          else
            unzip -q FlashDrop-android.zip -d _src
            echo "DIR=_src/FlashDrop" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlashDrop-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlashDrop build ${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
